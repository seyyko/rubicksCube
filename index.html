<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>rubik's cube</title>

    <meta
        name="description"
        content="Simulateur de Rubik's Cube 3D interactif développé en JavaScript vanilla. Manipulez les faces du cube, personnalisez ses couleurs, mélangez-le, suivez l'historique des mouvements, utilisez les contrôles de lecture et lancez sa résolution automatique avec chronomètre."
    >

    <link rel="stylesheet" href="./css/animation.css">
    <link rel="stylesheet" href="./css/history.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/link.css">
    <link rel="stylesheet" href="./css/canvas.css">
    <link rel="stylesheet" href="./css/popup.css">
    <link rel="stylesheet" href="./css/scan.css">
</head>
<body>

    <main>
        <div id="link">
            <a href="https://github.com/seyyko/rubicksCube">GITHUB</a>
        </div>
        <div id="history"></div>
        <div id="sidebar">
            <div id="controls">
                <div class="moves"></div>
                <div class="tools">
                    <section class="colors">
                        <h2>colors</h2>
                        <div class="paintCube">
                            <span><input type="color"></span>
                            <span><input type="color"></span>
                            <span><input type="color"></span>
                            <span><input type="color"></span>
                            <span><input type="color"></span>
                            <span><input type="color"></span>
                        </div>

                        <div class="resetColor">
                            <button>reset color</button>
                        </div>

                        <div class="scan">
                            <button>scan your cube</button>
                        </div>
                        <div class="checkScan">
                            <button>check the cube</button>
                        </div>
                    </section>

                    <section class="view">
                        <h2>view</h2>

                        <div class="resetPos">
                            <button>reset position</button>
                        </div>

                        <div class="debug">
                            <input type="checkbox" name="debug">
                            <label for="debug">debug mode</label>
                        </div>
                    </section>

                    <section class="solving">
                        <h2>solving</h2>

                        <div class="solve">
                            <button>solve the cube</button>
                        </div>

                        <form class="customHistory">
                            <input
                                type="text"
                                name="customHistory"
                                placeholder="Enter your scramble"
                            >
                            <button type="submit">submit</button>
                        </form>

                        <div class="playbackControls">
                            <button class="previous">◀◀</button>
                            <button class="pause">❚❚</button>
                            <button class="play">▶</button>
                            <button class="stop">■</button>
                            <button class="next">▶▶</button>
                        </div>

                        <div class="solvingDelay">
                            <label>
                                <span>0sec</span>
                                <span>range delay</span>
                                <span>1sec</span>
                            </label>
                            <input type="range" value="5" max="10">
                            <label></label>
                        </div>
                    </section>
                </div>
            </div>

            <div id="commands">
                <button class="reset">RESET CUBE</button>
                <button class="shuffle">⇆</button>
                <button class="resolve">🪄</button>
            </div>
        </div>
        <div id="canvas">
            <div id="mainCube" class="cubeContainer"></div>
            <div id="timer">00:00:00</div>
            <div id="scanBox">
                <div class="cubeContainer"></div>
                <section id="camera">
                    <button class="front">FRONT</button>
                    <button class="upper">UPPER</button>
                    <button class="right">RIGHT</button>
                    <button class="left">LEFT</button>
                    <button class="back">BACK</button>
                    <button class="down">DOWN</button>
                    <input
                        type="file"
                        id="cameraInput"
                        accept="image/*"
                        capture="environment"
                        hidden
                    >
                </section>
                <section id="crop">
                    <div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <img src="img/191.png" alt="face's scan image">
                    </div>
                    <button>Confirm</button>
                </section>
                <p>
                    <span>
                        <span>> Left click (colors)</span>
                        <span>:</span>
                        <span>select color</span>
                    </span>
                    <span>
                        <span>> Hold/Right click (colors)</span>
                        <span>:</span>
                        <span>change color</span>
                    </span>
                    <span>
                        <span>> Left click</span>
                        <span>:</span>
                        <span>paint</span>
                    </span>
                    <span>
                        <span>> Right click</span>
                        <span>:</span>
                        <span>erase</span>
                    </span>
                    <span>
                        <span>> Left click face</span>
                        <span>:</span>
                        <span>scan</span>
                    </span>
                    <span>
                        <span>> Right click face</span>
                        <span>:</span>
                        <span>erase</span>
                    </span>
                    <span>
                        <span>> Drag</span>
                        <span>:</span>
                        <span>rotate</span>
                    </span>
                </p>
            </div>
        </div>
        <div id="bg"></div>
    </main>

    <section id="popup">
        <h1 class="title">title ...</h1>
        <div class="id">
            <p><b>id :</b></p>
            <p>???</p>
        </div>
        <div class="desc">
            <p><b>desc :</b></p>
            <p>[???, ???, ...]</p>
        </div>
        <button class="yesBtn"><b></b></button>
        <button class="noBtn"><b></b></button>
    </section>
    
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/eventHandler.js"></script>
    <script type="module" src="./js/pan.js"></script>
    <script type="module" src="./js/scan.js"></script>

</body>
</html>
